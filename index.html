<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中生代恐龍館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --bg:#E3E4DC; --surface:#F1F1EB; --ink:#1D2320; --muted:#5E665F; --line:#C8CABE;
  --accent:#2E6B5A; --accent-ink:#F1F1EB; --amber:#C98A22; --amber-ink:#1D1A12;
  --tri:#812B92; --jur:#2A97AE; --cre:#62A63A;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --surface:#1C221F; --ink:#E4E6DE; --muted:#9AA39A; --line:#313935;
    --accent:#78C0A7; --accent-ink:#0F221B; --amber:#E2A748; --amber-ink:#1D1A12;
    --tri:#B170BF; --jur:#5CC6DA; --cre:#95D168;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1C221F; --ink:#E4E6DE; --muted:#9AA39A; --line:#313935;
  --accent:#78C0A7; --accent-ink:#0F221B; --amber:#E2A748; --amber-ink:#1D1A12;
  --tri:#B170BF; --jur:#5CC6DA; --cre:#95D168;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:22px 40px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,3.4vw,38px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}

.stage{position:relative;height:min(72vh,680px);min-height:400px;border-radius:14px;overflow:hidden;background:#b9c9cf;border:1px solid var(--line);touch-action:none}
@media (max-width:600px){.stage{height:62vh;min-height:380px}}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lead line{stroke:#fff;stroke-width:1.6;stroke-dasharray:4 3}
.lead .ring{fill:none;stroke:var(--amber);stroke-width:2.5}
.lead .dot{fill:var(--amber);stroke:#fff;stroke-width:1.5}
.tag{position:absolute;left:0;top:0;font:500 11px/1 var(--mono);padding:4px 7px;border-radius:5px;background:rgba(20,24,22,.62);color:#eef0ea;white-space:nowrap}

.topbar,.toolbar{position:absolute;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.topbar{top:12px;justify-content:space-between}
.toolbar{bottom:12px;justify-content:space-between}
.topbar>*,.toolbar>*{pointer-events:auto}
.grp{display:flex;flex-wrap:wrap;gap:6px}
.cap{font:500 12px/1.4 var(--mono);color:#eef0ea;background:rgba(20,24,22,.55);border-radius:8px;padding:6px 10px;backdrop-filter:blur(6px)}
.cap b{font-weight:600}
.tbtn{font:500 13px/1 var(--sans);height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(20,24,22,.55);color:#eef0ea;cursor:pointer;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(20,24,22,.72)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tbtn.sq{width:34px;padding:0;justify-content:center;font-size:18px}
.tbtn.warm{background:rgba(160,70,40,.75);border-color:rgba(255,200,160,.35)}
.leftcol{display:grid;gap:12px;min-width:0}
.lab{position:absolute;left:0;top:0;font:700 13px/1 var(--sans);padding:6px 10px;border-radius:14px;background:rgba(20,24,22,.72);color:#fff;white-space:nowrap;pointer-events:none;backdrop-filter:blur(4px)}
.lab i{font-style:normal;color:var(--amber);margin-right:6px;font-family:var(--mono)}
.narr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.nhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.now{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.now .n{flex:none;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--amber);color:var(--amber-ink);font:600 11px/24px var(--mono);text-align:center}
.now b{font-family:var(--serif);font-size:17px}
.now .prog{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.nctl{display:flex;gap:6px}
.nbtn{font:500 13px var(--sans);height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.nbtn:hover{border-color:var(--muted)}
.nbtn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.nbtn:focus-visible,.vset select:focus-visible,.vset input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nbtn:disabled{opacity:.5;cursor:not-allowed}
.sub{margin:0;font-size:16px;line-height:1.7;max-width:70ch;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--amber) 10%,transparent);border-left:3px solid var(--amber)}
.vset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.vset select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;height:32px;padding:0 8px;max-width:100%;flex:1 1 220px;min-width:0}
.vset input[type=range]{width:90px;accent-color:var(--accent)}
.vset .chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.vn{margin:0;font-size:12px;color:var(--muted)}
.speaking .now .n{animation:blink 1s infinite}
.tbtn.tour{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
@keyframes blink{50%{opacity:.45}}
.busy{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.busy span{font:500 13px var(--mono);color:#eef0ea;background:rgba(20,24,22,.6);padding:8px 14px;border-radius:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:20px}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--mono);color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.name{display:grid;gap:2px}
.name h2{font-family:var(--serif);font-weight:900;font-size:42px;line-height:1.1;margin:6px 0 0;letter-spacing:.02em}
.sci{font-family:var(--serif);font-style:italic;font-size:17px}
.mean{font-size:13px;color:var(--muted)}
.desc{margin:0;max-width:65ch}
dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;padding-block:14px;border-block:1px solid var(--line)}
dl div{display:grid;gap:1px;min-width:0}
dt{font-size:11px;letter-spacing:.08em;color:var(--muted)}
dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
dd.num{font-family:var(--mono);font-size:16px}
dl .wide{grid-column:1/-1}
.sect{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect button{font:600 12px var(--sans);letter-spacing:0;border:1px solid var(--amber);background:none;color:var(--ink);border-radius:7px;height:28px;padding:0 10px;cursor:pointer}
.sect button:focus-visible{outline:2px solid var(--accent)}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.facts button{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:14px;line-height:1.55;padding:8px;border-radius:8px;cursor:pointer}
.facts button:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.facts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.facts .pl{margin-left:auto;flex:none;font-size:11px;color:var(--muted);align-self:center}
.facts .n{flex:none;margin-top:1px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font:600 11px/22px var(--mono);text-align:center}
.facts button.on .n{background:var(--accent);color:var(--accent-ink)}
.bars{display:grid;gap:1px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 50px;gap:10px;align-items:center;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:3px 2px;border-radius:6px;cursor:pointer;text-align:left}
.bar:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.bar:focus-visible{outline:2px solid var(--accent)}
.bar .trk{height:7px;border-radius:2px;background:color-mix(in srgb,var(--line) 70%,transparent);position:relative;overflow:hidden}
.bar .trk span{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:2px}
.bar .v{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bar.on{font-weight:700}
.bar.on .trk span{background:var(--accent)}
.bar.on .v{color:var(--ink)}
.bar.ref{cursor:default;color:var(--muted)}
.bar.ref:hover{background:none}
.bar.ref .trk span{background:var(--amber)}
.note{font-size:12px;color:var(--muted);margin:0}

.tlsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px 20px;display:grid;gap:12px}
.tlhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.tlhead h3{font-family:var(--serif);font-size:20px;margin:0}
.tlscroll{overflow-x:auto;padding-bottom:4px}
.tl{position:relative;min-width:860px;height:200px}
.band{position:absolute;top:0;height:34px;display:flex;align-items:center;padding-left:10px;font-size:13px;font-weight:700;border-left:1px solid var(--surface)}
.band::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.22}
.band::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.band span,.band small{position:relative}
.band small{font:400 11px var(--mono);color:var(--muted);margin-left:8px}
.tick{position:absolute;top:38px;font:500 11px var(--mono);color:var(--muted);transform:translateX(-50%)}
.tick.first{transform:none}.tick.last{transform:translateX(-100%)}
.mk{position:absolute;top:62px;display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 4px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;border-radius:6px;white-space:nowrap}
.mk .rng{height:10px;min-width:8px;border-radius:2px;background:var(--c);flex:none}
.mk small{font:400 11px var(--mono);color:var(--muted)}
.mk.right{flex-direction:row-reverse}
.mk:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.mk.on{font-weight:700;outline:1.5px solid var(--accent)}
.mk:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.speaking .now .n{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Mesozoic Era · 252–66 Ma · 15 species</div>
      <h1>中生代恐龍館</h1>
    </div>
    <p class="hint">拖曳旋轉 · 滾輪或雙指縮放 · 按「語音解說」逐一講解構造 · <kbd>←</kbd> <kbd>→</kbd> 切換物種 · <kbd>1</kbd>–<kbd>5</kbd> 切換動作</p>
  </header>

  <div class="main">
    <div class="leftcol">
    <div class="stage" id="stage">
      <div class="layer" id="layer"></div>
      <div class="busy" id="busy"><span id="busyT">載入 3D 場景中…</span></div>
      <div class="topbar">
        <div class="cap" id="cap">&nbsp;</div>
        <div class="grp">
          <button class="tbtn sq" id="prev" aria-label="上一種恐龍">‹</button>
          <button class="tbtn sq" id="next" aria-label="下一種恐龍">›</button>
        </div>
      </div>
      <svg class="lead" id="lead" style="display:none" aria-hidden="true"><line id="leadL"></line><circle class="ring" id="leadR" r="13"></circle><circle class="dot" id="leadD" r="4"></circle></svg>
      <div class="lab" id="lab" hidden></div>
      <div class="toolbar">
        <div class="grp" role="group" aria-label="動作">
          <button class="tbtn" data-s="stand" aria-pressed="false">站立</button>
          <button class="tbtn" data-s="walk" aria-pressed="false">走路</button>
          <button class="tbtn" data-s="run" aria-pressed="false">跑步</button>
          <button class="tbtn" data-s="rest" aria-pressed="false">休息</button>
          <button class="tbtn" data-s="eat" aria-pressed="false">進食</button>
          <button class="tbtn warm" id="bRoar">吼叫</button>
        </div>
        <div class="grp">
          <button class="tbtn" id="bRot" aria-pressed="true">自動環繞</button>
          <button class="tbtn" id="bHuman" aria-pressed="true">人類比例</button>
          <button class="tbtn" id="bReset">重設視角</button>
        </div>
      </div>
    </div>
    <section class="narr" id="narr" aria-label="語音解說">
      <div class="nhead">
        <button class="nbtn primary" id="bTour">▶ 語音解說</button>
        <div class="now"><span class="n" id="coN">—</span><b id="coT">逐段講解這隻恐龍的構造</b><span class="prog" id="coP"></span></div>
        <div class="nctl" id="nctl" hidden><button class="nbtn" id="tPrev">上一段</button><button class="nbtn" id="tNext">下一段</button><button class="nbtn" id="tStop">結束</button></div>
      </div>
      <p class="sub" id="coX" hidden aria-live="polite"></p>
      <div class="vset">
        <label for="vSel">配音</label><select id="vSel"><option>載入語音中…</option></select>
        <label for="vRate">語速</label><input type="range" id="vRate" min="0.7" max="1.4" step="0.05" value="1">
        <label for="vPitch">音調</label><input type="range" id="vPitch" min="0.7" max="1.3" step="0.05" value="1">
        <button class="nbtn" id="vTry">試聽</button>
        <label class="chk"><input type="checkbox" id="vOn" checked>播放聲音</label>
      </div>
      <p class="vn" id="coV" hidden></p>
    </section>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="tlsec">
    <div class="tlhead">
      <h3>地質年代</h3>
      <p class="note">橫軸依實際年代比例排列，單位為百萬年前（Ma）。色帶採國際地層委員會（ICS）年代表配色。</p>
    </div>
    <div class="tlscroll"><div class="tl" id="tl"></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  panel.querySelectorAll('.facts button').forEach(b=>b.classList.remove('on'));

// w:wave f:[start,peak,end]Hz g:growl depth gr:growl rate d:distortion nz/nf:breath noise fm:formants[freq,Q,gain] sub:rumble vib:[rate,depth] a/r:attack/release n:calls gap mouth:jaw open lift:head raise

  velociraptor:{n:2,gap:.12,dur:.55,f:[950,1450,620],w:'triangle',g:.3,gr:70,d:8,nz:.6,nf:4200,fm:[[1500,3,1],[3200,4,.5]],sub:0,vib:[28,160],a:.03,r:.25,mouth:.9,lift:.18},
  gallimimus:{n:3,gap:.14,dur:.3,f:[420,540,380],w:'square',g:.1,gr:40,d:4,nz:.15,nf:2000,fm:[[900,6,1],[1850,7,.5]],sub:0,vib:[7,10],a:.02,r:.12,mouth:.8,lift:.2},
  brachiosaurus:{n:1,dur:3.6,f:[48,58,34],w:'sawtooth',g:.3,gr:11,d:10,nz:.2,nf:260,fm:[[110,6,1],[250,6,.6],[520,6,.25]],sub:1,vib:[3,2],a:.9,r:1.5,mouth:.22,lift:.12},
  diplodocus:{n:2,gap:.35,dur:2.2,f:[52,60,38],w:'sawtooth',g:.28,gr:10,d:10,nz:.2,nf:240,fm:[[120,6,1],[270,6,.55],[540,6,.2]],sub:1,vib:[3,2],a:.6,r:1,mouth:.2,lift:.1},
  parasaurolophus:{n:1,dur:2.8,f:[108,118,96],w:'sawtooth',g:.05,gr:20,d:3,nz:.08,nf:500,fm:[[210,12,1.2],[420,10,.6],[630,9,.3],[840,9,.15]],sub:.4,vib:[4.5,2],a:.35,r:1,mouth:.35,lift:.3},
  iguanodon:{n:1,dur:1.6,f:[120,145,78],w:'sawtooth',g:.4,gr:26,d:14,nz:.3,nf:700,fm:[[300,5,1],[800,5,.5]],sub:.4,vib:[5,4],a:.2,r:.6,mouth:.7,lift:.3},
  plateosaurus:{n:1,dur:1.4,f:[150,172,108],w:'sawtooth',g:.25,gr:24,d:10,nz:.25,nf:900,fm:[[340,6,1],[900,6,.45]],sub:.2,vib:[5,4],a:.15,r:.6,mouth:.7,lift:.3},
  triceratops:{n:2,gap:.25,dur:1.1,f:[88,102,60],w:'sawtooth',g:.6,gr:24,d:22,nz:.35,nf:500,fm:[[220,4,1],[600,5,.5]],sub:.7,vib:[4,4],a:.15,r:.5,mouth:.55,lift:.2},
  ankylosaurus:{n:3,gap:.18,dur:.45,f:[72,82,55],w:'sawtooth',g:.7,gr:19,d:25,nz:.45,nf:380,fm:[[180,4,1],[480,5,.5]],sub:.8,vib:[3,3],a:.05,r:.2,mouth:.4,lift:.12},
  stegosaurus:{n:1,dur:1.9,f:[78,86,54],w:'sawtooth',g:.35,gr:15,d:12,nz:.25,nf:400,fm:[[190,5,1],[500,5,.45]],sub:.7,vib:[3,3],a:.4,r:.8,mouth:.45,lift:.15},
  pachycephalosaurus:{n:2,gap:.15,dur:.5,f:[200,245,150],w:'square',g:.5,gr:30,d:12,nz:.4,nf:1300,fm:[[500,5,1],[1300,5,.4]],sub:.2,vib:[6,5],a:.04,r:.2,mouth:.6,lift:.2}

let AC=null,master=null,rev=null,nbuf=null;
function audio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.8;master.connect(comp);
    rev=AC.createConvolver();const n=AC.sampleRate*2.4|0,ir=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}
    rev.buffer=ir;const rg=AC.createGain();rg.gain.value=.28;rev.connect(rg);rg.connect(comp);
    nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const nd=nbuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;}

const distCurve=k=>{const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;};
function callVoice(ac,t0,p,i){
  const dur=p.dur*(i%2?.88:1),T=t0+dur,pk=t0+dur*.3,A=Math.min(p.a,dur*.4),Rl=Math.min(p.r,dur*.6),stop=T+.15,ramp=(prm,a,b,c)=>{prm.setValueAtTime(a,t0);prm.linearRampToValueAtTime(b,pk);prm.exponentialRampToValueAtTime(Math.max(c,1),T);};

  [0,1].forEach(k=>{const o=ac.createOscillator();o.type=p.w;o.detune.value=k?11:-7;ramp(o.frequency,p.f[0],p.f[1],p.f[2]);
    const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=p.vib[0]*(k?1.13:1);lg.gain.value=p.vib[1];l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(stop);o.connect(src);o.start(t0);o.stop(stop);});

  const ns=ac.createBufferSource();ns.buffer=nbuf;ns.loop=true;const nb=ac.createBiquadFilter();nb.type='bandpass';nb.frequency.value=p.nf;nb.Q.value=.7;const ng=ac.createGain();ng.gain.value=p.nz;ns.connect(nb);nb.connect(ng);ng.connect(am);ns.start(t0,Math.random());ns.stop(stop);

  mix.connect(out);out.connect(master);out.connect(rev);}
function doRoar(){if(!D)return;const p=ROAR[D.sp.id]||ROAR.trex,calls=[];
  for(let i=0;i<p.n;i++)calls.push([i*(p.dur+(p.gap||.15)),p.dur*(i%2?.88:1)]);
  const total=calls[calls.length-1][0]+calls[calls.length-1][1]+.35;
  if(D.gl){const a=D.actions[D.cfg.anim.roar];roarGL={until:performance.now()/1000+(a?a.getClip().duration:2)};}else roar={t0:performance.now()/1000+.03,calls,total,mouth:p.mouth,lift:p.lift,shake:p.shake};
  try{const ac=audio();if(ac){const t0=ac.currentTime+.03;calls.forEach(([st],i)=>callVoice(ac,t0+st,p,i));}}catch(e){console.warn(e);}}
$('#bRoar').onclick=doRoar;
$('#bRot').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));};
$('#bHuman').onclick=e=>{showHuman=!showHuman;e.currentTarget.setAttribute('aria-pressed',String(showHuman));human.visible=showHuman;if(grid)grid.visible=showHuman;};
$('#bReset').onclick=()=>{if(!D)return;const fw=focusWorld();tween={t0:performance.now(),dur:reduce?1:800,fp:camera.position.clone(),ft:controls.target.clone(),tp:fw.clone().add(D.homeOff),tt:fw};};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='Escape'){endTour();return;}
  if(e.key==='ArrowRight')select(idx+1);else if(e.key==='ArrowLeft')select(idx-1);
  else{const k=['1','2','3','4','5'].indexOf(e.key);if(k>=0)setState(['stand','walk','run','rest','eat'][k]);}});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

/* ============================ loop ============================ */
const v=new V3(),ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let last=performance.now(),capT=0;
function place(el,obj,w,h,isTag){obj.getWorldPosition(v);v.project(camera);const vis=v.z<1&&v.x>-1.05&&v.x<1.05&&v.y>-1.05&&v.y<1.05;
  if(el.hidden===vis)el.hidden=!vis;if(vis)el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px)`+(isTag?' translate(-50%,-100%)':'');}
function drawLead(w,h){const st=tour&&tour.steps[tour.i];if(!st||!st.anchor)return;
  st.anchor.getWorldPosition(v);v.project(camera);const on=v.z<1,ax=(v.x*.5+.5)*w,ay=(-v.y*.5+.5)*h,lb=$('#lab'),lw=lb.offsetWidth,lh=lb.offsetHeight;
  const dx=ax>w/2?1:-1,bx=clamp(ax+dx*54-(dx<0?lw:0),10,w-lw-10),by=clamp(ay-70,52,h-lh-60);
  lb.style.transform=`translate(${bx}px,${by}px)`;lb.style.opacity=on?1:0;
  const L=$('#leadL');L.setAttribute('x1',dx>0?bx:bx+lw);L.setAttribute('y1',by+lh/2);L.setAttribute('x2',ax);L.setAttribute('y2',ay);
  $('#leadR').setAttribute('cx',ax);$('#leadR').setAttribute('cy',ay);$('#leadD').setAttribute('cx',ax);$('#leadD').setAttribute('cy',ay);$('#lead').style.opacity=on?1:0;}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now/1000,now);render();
}
function update(dt,t,now){
  if(D&&!building){
    const c=D.c;
    if(D.gl)updateGL(dt,t);else{
    const T=targets();
    for(const k in T){const rate=k==='v'?1.3:k==='lie'?1.2:2.2;c[k]+=(T[k]-c[k])*Math.min(1,dt*rate);}
    stepGait(D,D.g,c.v,dt,t);
    D.theta+=c.v/D.Rp*dt;D.root.position.set(Math.sin(D.theta)*D.Rp,0,D.Rp-Math.cos(D.theta)*D.Rp);D.root.rotation.y=-D.theta;
    const cc=Object.assign({},c),mk=reduce?.3:1,look=(1-clamp(c.v/(D.b.speed[0]*.5),0,1))*(1-c.lie*.6)*(state==='eat'?.2:1)*(tour?.25:1);
    cc.yaw=Math.sin(t*.37)*.22*look*mk;cc.hyaw=Math.sin(t*.53+1)*.14*look*mk;
    if(state==='eat'&&D.eat){const settle=smooth(.5,1,1-Math.min(1,Math.abs(c.neck-D.eat.neck)*3));
      if(D.sp.diet==='carn'||D.sp.diet==='fish'){const cy=(t%2.8)/2.8,pull=Math.sin(Math.PI*clamp(cy/.35,0,1));
        cc.neck+=.22*pull*settle;cc.head+=.35*pull*settle;cc.hyaw+=.22*Math.sin(t*15)*pull*settle*mk;cc.jaw+=(cy>.75?smooth(.75,.85,cy)*(1-smooth(.93,1,cy)):.12*pull)*settle;}
      else{const cy=(t%3.4)/3.4,tug=Math.sin(Math.PI*clamp((cy-.7)/.3,0,1));cc.jaw+=.22*(.5+.5*Math.sin(t*8))*settle;cc.neck+=(.03*Math.sin(t*1.3)+.1*tug)*settle;cc.head+=(.07*Math.sin(t*2.1)+.12*tug)*settle;}}
    if(roar){const k=(t-roar.t0)/roar.total;if(k>=1)roar=null;else if(k>0){const e=smooth(0,.12,k)*(1-smooth(.82,1,k));let jw=0;roar.calls.forEach(([st,d])=>{const q=(t-roar.t0-st)/d;if(q>0&&q<1.15)jw=Math.max(jw,Math.sin(Math.PI*clamp(q*1.1,0,1)));});
      cc.jaw=Math.max(cc.jaw,jw*roar.mouth);cc.head+=roar.lift*e;cc.neck+=roar.lift*.5*e;cc.hyaw*=1-e;if(roar.shake)cc.hyaw+=Math.sin(t*8)*.05*jw;}}
    if(tour&&tour.steps[tour.i].jaw)cc.jaw=Math.max(cc.jaw,.55);
    applyPose(D,cc,D.g);}
    followHuman(dt);
    const fw=focusWorld(),dl=fw.clone().sub(lastFocus);lastFocus.copy(fw);
    camera.position.add(dl);controls.target.add(dl);if(tween){tween.fp.add(dl);tween.ft.add(dl);tween.tp.add(dl);tween.tt.add(dl);}
    if(tour&&!tween){const st=tour.steps[tour.i];if(st.anchor){const dlt=st.anchor.getWorldPosition(new V3()).sub(controls.target).multiplyScalar(Math.min(1,dt*1.5));controls.target.add(dlt);camera.position.add(dlt);}}
    sun.target.position.copy(fw);sun.position.copy(fw).addScaledVector(theme.sun.clone().normalize(),D.shadowS*2.5);rim.position.set(fw.x-theme.sun.x*40,fw.y+18,fw.z-theme.sun.z*40);
    if(now-capT>200){capT=now;$('#cap').innerHTML=`<b>${idx+1} / ${SP.length}</b> · ${D.sp.zh} · ${STATE_ZH[state]}${c.v>.05?` · ${kmh(c.v)} km/h`:''}`;}
  }
  if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),e=ease(k);camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);if(k>=1)tween=null;}
}
function render(){
  controls.update();sky.position.copy(camera.position);
  renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  drawLead(w,h);
  if(showHuman)place(tagEl,human.userData.label,w,h,true);else tagEl.hidden=true;

})();
